[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexter"
version = "0.1.0"
description = "Autonomous research and execution agent for Hyperliquid crypto futures."
authors = []
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.27",
    "langchain-openai>=0.3.35",
    "openai>=2.2.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.11.10",
    "python-dotenv>=1.1.1",
    "asyncio-throttle>=1.0.2",
    "eth-account>=0.13.7",
    "fastmcp>=2.10.6",
    "hyperliquid-python-sdk>=0.16.0",
]

[project.scripts]
dexter-agent = "dexter.cli:main"

[tool.setuptools.packages.find]
where = ["src", "hyperliquid-mcp/src"]
